name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Android iskeletini hazırla
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          flutter create . --platforms=android --org com.emre.butcetakip --project-name butce_takip
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          sed -i '/org.jetbrains.kotlin.android/s/version "[^"]*"/version "1.9.24"/' android/settings.gradle || true
          sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '1.9.24'/" android/build.gradle || true

      - name: Paketleri al
        run: flutter pub get

      - name: Eski paketlere namespace ekle
        run: |
          for pkg in telephony isar_flutter_libs flutter_notification_listener; do
            dir=$(find "$HOME/.pub-cache/hosted" -maxdepth 2 -type d -name "${pkg}-*" | head -n1)
            [ -z "$dir" ] && continue
            gradle="$dir/android/build.gradle"
            [ -f "$gradle" ] || continue
            if ! grep -q "namespace" "$gradle"; then
              ns=$(grep -o 'package="[^"]*"' "$dir/android/src/main/AndroidManifest.xml" | head -n1 | cut -d'"' -f2)
              sed -i "0,/android {/s//android {\n    namespace \"$ns\"/" "$gradle"
              echo "namespace $ns -> $pkg"
            fi
          done

      - name: Kotlin sürümlerini sabitle
        run: |
          find "$HOME/.pub-cache/hosted" -path "*/android/build.gradle" | while read -r g; do
            sed -i -E "s/(ext\.kotlin_version *= *)['\"][0-9.]+['\"]/\1'1.9.24'/" "$g"
          done
          cat >> android/build.gradle <<'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib')) {
                          details.useVersion '1.9.24'
                      }
                  }
              }
          }
          EOF
          tail -n 15 android/build.gradle

      - name: Isar kodunu üret
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analiz (bilgilendirme)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: APK derle
        run: flutter build apk --release

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
